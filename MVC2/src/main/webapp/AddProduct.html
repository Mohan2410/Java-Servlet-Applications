<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Product Form</title>
<style>
	.container{
		text-align: center;
	}
</style>
</head>	
<body>
	<div class="container">
	<h1>Product Form</h1><br><br>
	<form action="aps" method="post">
		<span>
			Product Code: <input type="text" name="pcode">
		</span>
		
		<br><br>
		
		<span>
			Product Name: <input type="text" name="pname">
		</span>
		
		<br><br>
		
		<span>
			Product Company: <input type="text" name="pcompany">
		</span>
		
		<br><br>
		
		<span>
			Product Price: <input type="text" name="pprice">
		</span>
		
		<br><br>
		
		<span>
			Product Quantity: <input type="text" name="pqty">
		</span>
		
		<br><br>
		
		<span>
			<input type="submit" name="Insert Product Data">
		</span>
		</form>
	</div>
</body>
</html>
